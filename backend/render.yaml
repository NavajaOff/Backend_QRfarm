services:
  - type: web
    name: qr-farm-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: DB_HOST
        value: ${qr-farm-db.HOST}
      - key: DB_USER
        value: ${qr-farm-db.USER}
      - key: DB_PASSWORD
        value: ${qr-farm-db.PASSWORD}
      - key: DB_NAME
        value: ${qr-farm-db.DATABASE}
      - key: DB_PORT
        value: ${qr-farm-db.PORT}
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://qr-farm.vercel.app
      - key: FLASK_ENV
        value: production
databases:
  - name: qr-farm-db
    databaseName: qrfarm
    user: qrfarm_user